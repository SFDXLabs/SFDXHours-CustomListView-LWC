<template>
    <div class="custom-list-view-container" style={containerStyle}>
        <!-- Header Section -->
        <div class="list-view-header">
            <div class="header-left">
                <template lwc:if={hasHeaderIcon}>
                    <template lwc:if={isUtilityHeaderIcon}>
                        <span class="header-icon header-icon-utility" style={headerIconStyle}>
                            <lightning-icon
                                icon-name={headerIconName}
                                size="x-small"
                                variant="inverse"
                                alternative-text={listViewTitle}>
                            </lightning-icon>
                        </span>
                    </template>
                    <template lwc:else>
                        <lightning-icon
                            icon-name={headerIconName}
                            size="medium"
                            class="header-icon"
                            style={headerIconStyle}
                            alternative-text={listViewTitle}>
                        </lightning-icon>
                    </template>
                </template>
                <div class="header-title-section">
                    <div class="header-title-row">
                        <h2 class="list-title">{listViewTitle}</h2>
                        <template lwc:if={showSelectionActions}>
                            <span class="slds-badge selection-count">{selectedCountLabel}</span>
                        </template>
                    </div>
                    <template lwc:if={hasSubtitle}>
                        <p class="list-subtitle">{listViewSubtitle}</p>
                    </template>
                    <p class="list-meta">
                        <span>{recordCountLabel}</span>
                        <template lwc:if={sortedByLabel}>
                            <span class="meta-sep">•</span>
                            <span>Sorted by {sortedByLabel}</span>
                        </template>
                        <template lwc:if={lastRefreshed}>
                            <span class="meta-sep">•</span>
                            <span>Updated&nbsp;<lightning-relative-date-time value={lastRefreshed}></lightning-relative-date-time></span>
                        </template>
                    </p>
                </div>
            </div>
            <div class="header-right">
                <!-- Selection Actions -->
                <template lwc:if={showSelectionActions}>
                    <div class="selection-actions">
                        <lightning-button
                            label="Change Owner"
                            variant="neutral"
                            icon-name="utility:change_owner"
                            onclick={openChangeOwnerModal}>
                        </lightning-button>
                        <lightning-button-icon
                            icon-name="utility:close"
                            variant="bare"
                            size="medium"
                            onclick={clearSelection}
                            alternative-text="Clear selection"
                            title="Clear selection">
                        </lightning-button-icon>
                    </div>
                </template>
                <template lwc:if={displaySearchBox}>
                    <div class="search-container">
                        <lightning-input
                            type="search"
                            variant="label-hidden"
                            label="Search"
                            placeholder="Search this list..."
                            value={searchTerm}
                            onchange={handleSearch}
                            class="search-input-slds">
                        </lightning-input>
                    </div>
                </template>
                <template lwc:if={displayActionsButton}>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        variant="border-filled"
                        alternative-text="Refresh"
                        title="Refresh"
                        onclick={loadData}
                        class="refresh-btn">
                    </lightning-button-icon>
                    <lightning-button-menu
                        alternative-text="Actions"
                        icon-name="utility:down"
                        menu-alignment="right"
                        class="actions-menu"
                        onselect={handleActionSelect}>
                        <template lwc:if={showExportPageOption}>
                            <lightning-menu-item value="exportPage" label="Export Page to CSV"></lightning-menu-item>
                        </template>
                        <template lwc:if={showExportAllOption}>
                            <lightning-menu-item value="exportAll" label="Export All to CSV"></lightning-menu-item>
                        </template>
                        <template lwc:if={selectableRows}>
                            <lightning-menu-item value="changeOwner" label="Change Owner" disabled={noSelectedRecords}></lightning-menu-item>
                        </template>
                        <lightning-menu-divider></lightning-menu-divider>
                        <lightning-menu-item value="toggleWrap" label={wrapToggleLabel} icon-name="utility:rows"></lightning-menu-item>
                        <lightning-menu-item value="resetColumnWidths" label="Reset Column Widths" icon-name="utility:undo" disabled={noCustomColumnWidths}></lightning-menu-item>
                    </lightning-button-menu>
                </template>
            </div>
        </div>

        <!-- Quick Filters Bar -->
        <template lwc:if={hasQuickFilters}>
            <div class="filter-bar">
                <div class="filter-bar-content">
                    <template for:each={filterConfigurations} for:item="filter">
                        <div key={filter.fieldName} class="filter-item">
                            <lightning-combobox
                                name={filter.fieldName}
                                label={filter.label}
                                value={filter.value}
                                options={filter.options}
                                data-field={filter.fieldName}
                                onchange={handleFilterChange}>
                            </lightning-combobox>
                        </div>
                    </template>
                    <template lwc:if={hasActiveFilters}>
                        <lightning-button
                            label="Clear All Filters"
                            variant="base"
                            icon-name="utility:clear"
                            class="clear-filters-btn"
                            onclick={clearAllFilters}>
                        </lightning-button>
                    </template>
                </div>
            </div>
        </template>

        <!-- Skeleton Loading Rows -->
        <template lwc:if={showSkeleton}>
            <div class="table-wrapper" aria-busy="true" aria-label="Loading">
                <table class="slds-table slds-table_bordered slds-no-row-hover data-table">
                    <thead>
                        <tr class="table-header-row">
                            <template lwc:if={selectableRows}>
                                <th class="table-header-cell checkbox-cell" scope="col"></th>
                            </template>
                            <template for:each={columns} for:item="column">
                                <th key={column.fieldName} class="table-header-cell" scope="col">
                                    <span class="header-label">{column.label}</span>
                                </th>
                            </template>
                            <template lwc:if={displayRowActions}>
                                <th class="table-header-cell actions-header-cell" scope="col"></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={skeletonRows} for:item="row">
                            <tr key={row.key} class="skeleton-row">
                                <template lwc:if={selectableRows}>
                                    <td class="table-cell checkbox-cell"><div class="skeleton-bar skeleton-bar-icon"></div></td>
                                </template>
                                <template for:each={row.cells} for:item="cellKey">
                                    <td key={cellKey} class="table-cell"><div class="skeleton-bar"></div></td>
                                </template>
                                <template lwc:if={displayRowActions}>
                                    <td class="table-cell actions-cell"><div class="skeleton-bar skeleton-bar-icon"></div></td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- Error Message -->
        <template lwc:if={errorMessage}>
            <div class="slds-scoped-notification slds-scoped-notification_light slds-media slds-media_center" role="alert">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="utility:error" size="small" variant="error" alternative-text="Error"></lightning-icon>
                </div>
                <div class="slds-media__body">{errorMessage}</div>
            </div>
        </template>

        <!-- Data Table -->
        <template lwc:if={hasRecords}>
            <div class="table-region">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <div class="table-wrapper" aria-busy={isLoading}>
                <table class={tableClass} style={tableStyle} aria-label={listViewTitle}>
                    <thead>
                        <tr class="table-header-row">
                            <!-- File Type Icon Column Header -->
                            <template lwc:if={showFileTypeColumn}>
                                <th class="table-header-cell file-icon-cell" scope="col">
                                    <span class="header-label">Type</span>
                                </th>
                            </template>
                            <!-- Checkbox Column Header -->
                            <template lwc:if={selectableRows}>
                                <th class="table-header-cell checkbox-cell" scope="col">
                                    <lightning-input
                                        type="checkbox"
                                        variant="label-hidden"
                                        label="Select all records on this page"
                                        checked={allSelectedOnPage}
                                        onchange={handleSelectAll}
                                        class="table-checkbox">
                                    </lightning-input>
                                </th>
                            </template>
                            <template for:each={columns} for:item="column">
                                <th key={column.fieldName} class="table-header-cell resizable-header" scope="col" data-col={column.fieldName} aria-sort={column.ariaSort} style={column.headerStyle}>
                                    <div class="header-cell-content">
                                        <span class="header-label">{column.label}</span>
                                        <template lwc:if={column.sortable}>
                                            <template lwc:if={allowUserSort}>
                                                <button
                                                    class={column.sortButtonClass}
                                                    onclick={handleSort}
                                                    data-field={column.fieldName}
                                                    title={column.sortTitle}
                                                    aria-label={column.sortTitle}>
                                                    <lightning-icon
                                                        icon-name={column.sortIcon}
                                                        size="xx-small"
                                                        class="sort-icon">
                                                    </lightning-icon>
                                                </button>
                                            </template>
                                        </template>
                                    </div>
                                    <div
                                        class="resize-handle"
                                        data-field={column.fieldName}
                                        onpointerdown={handleResizeStart}
                                        onpointermove={handleResizeMove}
                                        onpointerup={handleResizeEnd}
                                        onpointercancel={handleResizeEnd}
                                        title="Drag to resize column"
                                        role="separator"
                                        aria-orientation="vertical"
                                        tabindex="-1">
                                    </div>
                                </th>
                            </template>
                            <!-- Row Actions Header -->
                            <template lwc:if={displayRowActions}>
                                <th class="table-header-cell actions-header-cell" scope="col">
                                    <span class="header-label">Actions</span>
                                </th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={displayRecords} for:item="record">
                            <tr key={record.Id} class={record.rowClass}>
                                <!-- File Type Icon Column -->
                                <template lwc:if={showFileTypeColumn}>
                                    <td class="table-cell file-icon-cell">
                                        <template lwc:if={record.hasFileIcon}>
                                            <lightning-icon 
                                                icon-name={record.fileIcon}
                                                size="small"
                                                class="file-type-icon"
                                                title={record.fileExtension}>
                                            </lightning-icon>
                                        </template>
                                    </td>
                                </template>
                                <!-- Checkbox Column -->
                                <template lwc:if={selectableRows}>
                                    <td class="table-cell checkbox-cell">
                                        <lightning-input
                                            type="checkbox"
                                            variant="label-hidden"
                                            label="Select record"
                                            data-id={record.Id}
                                            checked={record.isSelected}
                                            onchange={handleRowSelect}
                                            class="table-checkbox">
                                        </lightning-input>
                                    </td>
                                </template>
                                <template for:each={record.displayFields} for:item="field">
                                    <td key={field.key} class={tableCellClass}>
                                        <template lwc:if={field.isLink}>
                                            <a 
                                                href={field.linkUrl}
                                                class="record-link"
                                                onclick={handleLinkClick}
                                                data-id={field.linkRecordId}>
                                                {field.displayValue}
                                            </a>
                                        </template>
                                        <template lwc:elseif={field.isPill}>
                                            <span class="slds-badge pill" style={field.pillStyle}>
                                                {field.displayValue}
                                            </span>
                                        </template>
                                        <template lwc:elseif={field.isBoolean}>
                                            <lightning-icon
                                                icon-name={field.booleanIcon}
                                                size="x-small"
                                                class={field.booleanClass}
                                                alternative-text={field.displayValue}>
                                            </lightning-icon>
                                        </template>
                                        <template lwc:elseif={field.isCurrency}>
                                            <lightning-formatted-number
                                                value={field.rawValue}
                                                format-style="currency">
                                            </lightning-formatted-number>
                                        </template>
                                        <template lwc:elseif={field.isPercent}>
                                            <lightning-formatted-number 
                                                value={field.rawValue}
                                                format-style="percent"
                                                maximum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </template>
                                        <template lwc:elseif={field.isDate}>
                                            <lightning-formatted-date-time
                                                value={field.rawValue}
                                                year="numeric"
                                                month="short"
                                                day="2-digit">
                                            </lightning-formatted-date-time>
                                        </template>
                                        <template lwc:elseif={field.isDateTime}>
                                            <lightning-formatted-date-time
                                                value={field.rawValue}
                                                year="numeric"
                                                month="short"
                                                day="2-digit"
                                                hour="2-digit"
                                                minute="2-digit">
                                            </lightning-formatted-date-time>
                                        </template>
                                        <template lwc:elseif={field.isEmail}>
                                            <a href={field.emailHref} class="email-link">{field.displayValue}</a>
                                        </template>
                                        <template lwc:elseif={field.isPhone}>
                                            <a href={field.phoneHref} class="phone-link">{field.displayValue}</a>
                                        </template>
                                        <template lwc:elseif={field.isUrl}>
                                            <a href={field.displayValue} target="_blank" class="url-link">{field.urlDisplay}</a>
                                        </template>
                                        <template lwc:else>
                                            <span class="cell-value">{field.displayValue}</span>
                                        </template>
                                        <template lwc:if={enableCellCopy}>
                                            <lightning-button-icon
                                                icon-name="utility:copy_to_clipboard"
                                                variant="border-filled"
                                                size="small"
                                                class="cell-copy-btn"
                                                alternative-text="Copy to clipboard"
                                                title="Copy to clipboard"
                                                data-value={field.displayValue}
                                                onclick={handleCopyCell}>
                                            </lightning-button-icon>
                                        </template>
                                    </td>
                                </template>
                                <!-- Row Actions Cell -->
                                <template lwc:if={displayRowActions}>
                                    <td class="table-cell actions-cell" onclick={stopPropagation}>
                                        <lightning-button-menu
                                            alternative-text="Row Actions"
                                            icon-size="x-small"
                                            menu-alignment="right"
                                            variant="border-filled"
                                            onselect={handleRowActionSelect}
                                            data-record-id={record.Id}
                                            data-content-document-id={record.contentDocumentId}
                                            data-content-version-id={record.contentVersionId}>
                                            <!-- File-specific actions (shown first for file objects) -->
                                            <template lwc:if={isFileObject}>
                                                <lightning-menu-item 
                                                    value="viewFile" 
                                                    label="View File"
                                                    icon-name="utility:preview">
                                                </lightning-menu-item>
                                                <lightning-menu-item 
                                                    value="downloadFile" 
                                                    label="Download File"
                                                    icon-name="utility:download">
                                                </lightning-menu-item>
                                                <lightning-menu-divider></lightning-menu-divider>
                                            </template>
                                            <!-- Standard record actions -->
                                            <lightning-menu-item 
                                                value="view" 
                                                label="View Record"
                                                icon-name="utility:open">
                                            </lightning-menu-item>
                                            <lightning-menu-item 
                                                value="edit" 
                                                label="Edit Record"
                                                icon-name="utility:edit">
                                            </lightning-menu-item>
                                            <lightning-menu-item 
                                                value="changeOwner" 
                                                label="Change Owner"
                                                icon-name="utility:change_owner">
                                            </lightning-menu-item>
                                        </lightning-button-menu>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            </div>

            <!-- Pagination -->
            <template lwc:if={showPagination}>
                <div class="pagination-container">
                    <div class="pagination-info">
                        Showing {paginationStartRecord} - {paginationEndRecord} of {totalRecordsLabel}
                        <template lwc:if={pageLimitHint}>
                            <div class="slds-text-body_small" role="status">{pageLimitHint}</div>
                        </template>
                    </div>
                    <div class="page-size-control">
                        <lightning-combobox
                            label="Rows per page"
                            variant="label-hidden"
                            value={pageSizeValue}
                            options={pageSizeOptions}
                            onchange={handlePageSizeChange}
                            class="page-size-combobox">
                        </lightning-combobox>
                        <span class="page-size-label">per page</span>
                    </div>
                    <div class="pagination-controls">
                        <lightning-button-icon
                            icon-name="utility:jump_to_left"
                            variant="border-filled"
                            size="small"
                            alternative-text="First Page"
                            title="First Page"
                            disabled={isFirstPage}
                            onclick={handleFirstPage}
                            class="pagination-btn-slds">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            variant="border-filled"
                            size="small"
                            alternative-text="Previous Page"
                            title="Previous Page"
                            disabled={isFirstPage}
                            onclick={handlePreviousPage}
                            class="pagination-btn-slds">
                        </lightning-button-icon>
                        <span class="page-indicator">
                            Page {currentPage} of {totalPages}
                        </span>
                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            variant="border-filled"
                            size="small"
                            alternative-text="Next Page"
                            title="Next Page"
                            disabled={isLastPage}
                            onclick={handleNextPage}
                            class="pagination-btn-slds">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:jump_to_right"
                            variant="border-filled"
                            size="small"
                            alternative-text="Last Page"
                            title="Last Page"
                            disabled={isLastPage}
                            onclick={handleLastPage}
                            class="pagination-btn-slds">
                        </lightning-button-icon>
                    </div>
                </div>
            </template>
        </template>

        <!-- Empty State -->
        <template lwc:if={showEmptyState}>
            <div class="slds-illustration slds-illustration_small slds-p-vertical_xx-large">
                <lightning-icon
                    icon-name={emptyStateIcon}
                    size="large"
                    class="empty-icon">
                </lightning-icon>
                <div class="slds-text-longform">
                    <h3 class="slds-text-heading_medium">{emptyStateMessage}</h3>
                    <template lwc:if={emptyStateSubtext}>
                        <p class="slds-text-body_regular">{emptyStateSubtext}</p>
                    </template>
                </div>
                <template lwc:if={hasActiveFilters}>
                    <lightning-button
                        label="Clear All Filters"
                        variant="neutral"
                        icon-name="utility:clear"
                        onclick={clearAllFilters}
                        class="slds-m-top_medium">
                    </lightning-button>
                </template>
            </div>
        </template>
    </div>

    <!-- Change Owner Modal -->
    <template lwc:if={showChangeOwnerModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true" aria-labelledby="change-owner-modal-heading" onkeydown={handleModalKeydown}>
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeChangeOwnerModal}
                        alternative-text="Close">
                    </lightning-button-icon>
                    <h1 id="change-owner-modal-heading" class="slds-modal__title slds-hyphenate">Change Owner</h1>
                    <p class="slds-text-body_small slds-m-top_x-small">
                        Change owner for {changeOwnerCount} selected record(s)
                    </p>
                </div>
                <div class="slds-modal__content slds-p-around_medium change-owner-modal-content">
                    <template lwc:if={changeOwnerError}>
                        <div class="slds-text-color_error slds-m-bottom_small" role="alert">{changeOwnerError}</div>
                    </template>
                    <lightning-record-picker
                        label="New Owner"
                        placeholder="Search users by name..."
                        object-api-name="User"
                        filter={userFilter}
                        display-info={userDisplayInfo}
                        matching-info={userMatchingInfo}
                        onchange={handleOwnerChange}>
                    </lightning-record-picker>
                </div>
                <div class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeChangeOwnerModal}>
                    </lightning-button>
                    <lightning-button
                        label={changeOwnerButtonLabel}
                        variant="brand"
                        onclick={handleConfirmOwnerChange}
                        disabled={isConfirmOwnerChangeDisabled}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
